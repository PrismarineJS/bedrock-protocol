name: CI

on:
  push:
    branches: [ '*', '!gh-pages' ]
  pull_request:
    branches: [ '*', '!gh-pages' ]
  workflow_dispatch:
    inputs:
      via:
          description: 'trigger origin'
          required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 14
    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}
    # Old versions of bedrock use old libssl that Ubuntu no longer ships with; need manual install
    - name: (Linux) Install libssl 1.1
      if: runner.os == 'Linux'
      run: |
        wget http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb
        sudo dpkg -i libssl1.1_1.1.1f-1ubuntu2_amd64.deb
    - run: npm install
    - run: npm test

  # Stable branch-protection check; every required matrix job must pass.
  ci:
    name: ci
    if: ${{ always() }}
    needs: ["build"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all mandatory jobs to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_JOBS: '["build"]'
          MATRIX_OUTPUTS: '[]'
        shell: python
        run: |
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          expected = json.loads(os.environ["EXPECTED_JOBS"])
          if not expected or set(needs) != set(expected):
              sys.exit("Missing or unexpected required jobs")
          failed = {name: job.get("result") for name, job in needs.items()
                    if job.get("result") != "success"}
          if failed:
              sys.exit("Required jobs did not succeed: " + json.dumps(failed))
          for job, output, field in json.loads(os.environ["MATRIX_OUTPUTS"]):
              matrix = json.loads(needs[job]["outputs"][output])
              entries = matrix[field] if field else matrix
              if not isinstance(entries, list) or not entries:
                  sys.exit("Empty or invalid required matrix: " + job)
          print("All required jobs succeeded")
